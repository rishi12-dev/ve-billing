{% extends "base.html" %}
{% block content %}
<div class="login-wrap">
  <form class="login-card" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <div class="text-center mb-3">
      <img src="{{ url_for('static', filename='icons/icon-96.png') }}" width="64" height="64" alt="Logo" class="rounded-circle shadow-sm mb-2">
      <h1 class="h3 fw-bold mb-1">Company Billing</h1>
      <p class="text-muted small">Sign in to manage quotations, invoices, GST and payments.</p>
    </div>
    
    <div class="mb-2">
      <label class="form-label small fw-semibold">Username / Email</label>
      <input class="form-control" name="identity" required autofocus autocomplete="username">
    </div>
    
    <div class="mb-2">
      <label class="form-label small fw-semibold">Password</label>
      <input class="form-control" type="password" name="password" required autocomplete="current-password">
    </div>
    
    <div class="form-check my-3">
      <input class="form-check-input" type="checkbox" name="remember" id="remember">
      <label class="form-check-label small" for="remember">Remember Me</label>
    </div>
    
    <button class="btn btn-primary w-100 py-2 fw-semibold">Login</button>
    
    <div class="text-center mt-3 small">
      <span class="text-muted">Don't have an account?</span>
      <a href="{{ url_for('auth.register') }}" class="fw-bold text-decoration-none ms-1">Create Account</a>
    </div>
    
    <div class="small text-muted text-center mt-3 pt-2 border-top">Default Admin: <code>admin</code> / <code>admin123</code></div>
  </form>
</div>
{% endblock %}
