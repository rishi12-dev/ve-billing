{% extends "base.html" %}
{% block content %}
<div class="login-wrap">
  <form class="login-card" method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <h1>Company Billing</h1>
    <p>Sign in to manage quotations, invoices, GST and payments.</p>
    <label class="form-label">Username / Email</label>
    <input class="form-control" name="identity" required autofocus>
    <label class="form-label mt-3">Password</label>
    <input class="form-control" type="password" name="password" required>
    <div class="form-check mt-3">
      <input class="form-check-input" type="checkbox" name="remember" id="remember">
      <label class="form-check-label" for="remember">Remember Me</label>
    </div>
    <button class="btn btn-primary w-100 mt-4">Login</button>
    <div class="small text-muted mt-3">Default admin: admin / admin123</div>
  </form>
</div>
{% endblock %}
